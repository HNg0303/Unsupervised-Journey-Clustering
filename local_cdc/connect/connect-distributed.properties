# Single-worker Kafka Connect cluster for local simulation.
bootstrap.servers=kafka:9092
group.id=local-cdc-connect

# Connect keeps its own state (connector configs, source offsets = MongoDB
# resume tokens, status) in these compacted Kafka topics.
config.storage.topic=_connect_configs
offset.storage.topic=_connect_offsets
status.storage.topic=_connect_status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=5000

# JSON with embedded schema so the JDBC sink knows column types.
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true

listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
plugin.path=/opt/connect-plugins
